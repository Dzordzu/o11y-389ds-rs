[package]
name = "nagios-389ds-rs"
version = "0.3.0"
edition = "2021"
license = "MIT"
description = "nagios checks for 389ds"

   [package.metadata.generate-rpm]
   assets = [
      { source = "target/x86_64-unknown-linux-musl/release/nagios-389ds-rs", dest = "/usr/lib64/nagios/plugins/check_389ds_rs", mode = "755" },
      { source = "nagios-389ds-rs/misc/nagios.sudoers", dest = "/etc/sudoers.d/nagios-389ds-rs", mode = "440", user = "root" },
   ]

[dependencies]
clap = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
ldap3 = { workspace = true }
openssl-sys = { workspace = true }
internal = { path = "../internal" }
